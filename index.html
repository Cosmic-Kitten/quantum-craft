<form action="https://api.web3forms.com/submit" method="POST" id="websiteRequestForm">
  
  <!-- Web3Forms Access Key -->
  <input type="hidden" name="access_key" value="a91921da-c67e-4307-b012-47676ea01cc4">

  <!-- Full Name (Required) -->
  <div class="form-group">
    <label for="fullName">Full Name <span class="required">*</span></label>
    <input type="text" id="fullName" name="name" placeholder="Jane Doe" required />
  </div>

  <!-- Email (Required) -->
  <div class="form-group">
    <label for="email">Email Address <span class="required">*</span></label>
    <input type="email" id="email" name="email" placeholder="jane@example.com" required />
  </div>

  <!-- Phone Number (Optional) -->
  <div class="form-group">
    <label for="phone">Phone Number <span class="optional">(Optional)</span></label>
    <input type="tel" id="phone" name="phone" placeholder="+1 (555) 000-0000" />
  </div>

  <!-- Additional Info / Message (Optional) -->
  <div class="form-group">
    <label for="additionalInfo">Additional Information <span class="optional">(Optional)</span></label>
    <textarea id="additionalInfo" name="message" rows="4" placeholder="Tell us about your target audience, design preferences, or specific feature requirements..."></textarea>
  </div>

  <!-- Optional: Redirect back to your site after submission -->
  <input type="hidden" name="redirect" value="https://your-vercel-deployment-url.vercel.app/#request">

  <button type="submit" class="btn btn-primary btn-full">Submit Website Request</button>
</form>
